name: Android CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint, License Audit & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Detekt static analysis
        run: ./gradlew detekt --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Verify dependency licenses (AGPL-3.0 compatibility)
        run: ./gradlew licenseeDebug --stacktrace

      - name: Run unit, DAO, repository & Robolectric tests
        run: ./gradlew :core:model:test testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify merged manifest security invariants
        shell: pwsh
        run: ./scripts/verify-security.ps1 -SkipGitleaks -AllowCloudPermissions

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-debug.*
            **/build/reports/tests/testDebugUnitTest/
            app/build/reports/licensee/
          if-no-files-found: ignore
